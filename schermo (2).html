<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Schermo · Canta con Lopee J!</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  /* Lo schermo resta sempre scuro: è pensato per proiettore e TV in sala */
  :root{--bg:#0b0e08;--surface:#171b11;--surface-2:#20261a;--line:#2e3626;--fg:#f2f6ea;--muted:#9aa58c;--lime:#8acb2c;--lime-ink:#9ad93a;--lime-soft:#1f2c10;--on-lime:#0c1006;--live:#ff5a6e;--live-soft:#3a1419;color-scheme:dark}
  html,body{height:100%;overflow:hidden;background:#000}
  #stage{position:fixed;inset:0;background:#000}
  #player,#player iframe,#bgplayer,#bgplayer iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  #bgwrap{position:absolute;inset:0}

  .overlay{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto;gap:clamp(16px,3vh,40px);padding:clamp(20px,4vw,56px);
    --dim:.94;background:radial-gradient(ellipse at 85% 10%,rgba(138,203,44,.16),transparent 55%),rgba(11,14,8,var(--dim));transition:opacity .45s,background-color .8s}
  /* il video della musica d'attesa traspare dietro la grafica */
  .overlay.see-through{background:linear-gradient(to top,rgba(11,14,8,.88),rgba(11,14,8,0) 45%),linear-gradient(to bottom,rgba(11,14,8,.7),rgba(11,14,8,0) 30%),rgba(11,14,8,var(--dim))}
  .overlay.see-through .who,.overlay.see-through .what,.overlay.see-through .kicker,.overlay.see-through .brand,.overlay.see-through .upnext{text-shadow:0 2px 18px rgba(0,0,0,.75)}
  #player{transition:opacity .6s}
  #player.behind{opacity:0;pointer-events:none}
  .overlay.hide{opacity:0;pointer-events:none}
  .overlay .brand{font-size:clamp(20px,2.6vw,38px);color:var(--fg)}

  .hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:center;min-height:0}
  .hero.no-pic{grid-template-columns:minmax(0,1fr)}
  .pic{width:min(38vh,30vw);aspect-ratio:1;border-radius:8px;background:var(--surface-2) center/cover no-repeat;border:clamp(4px,.5vw,8px) solid var(--lime);
    display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:min(14vh,11vw);color:var(--lime);box-shadow:0 0 80px rgba(138,203,44,.25)}
  /* banner del DJ: solo i due ritagli del viso, compatto sotto il titolo */
  .dj-banner{display:inline-flex;align-items:center;gap:clamp(14px,1.4vw,22px);margin-top:clamp(20px,4vh,44px);padding:clamp(8px,.8vw,12px) clamp(18px,1.8vw,28px) clamp(8px,.8vw,12px) clamp(8px,.8vw,12px);
    background:rgba(23,27,17,.82);border-left:6px solid var(--lime);border-radius:6px}
  .dj-banner .faces{display:flex;flex:none}
  .dj-banner .face{width:clamp(60px,9vh,112px);aspect-ratio:1;border-radius:50%;background:var(--surface-2) center/cover no-repeat;border:3px solid var(--lime);box-shadow:0 0 0 4px rgba(11,14,8,.9)}
  .dj-banner .face.mic{display:grid;place-items:center;background:#11160c}
  .dj-banner .face.mic svg{width:68%;height:68%}
  .dj-banner .face + .face{margin-left:calc(clamp(60px,9vh,112px) * -.28)}
  .dj-banner .k{display:block;font-family:var(--f-display);font-weight:600;font-size:clamp(11px,1vw,16px);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:clamp(6px,.8vh,10px)}
  .dj-banner .logo{display:block;height:clamp(22px,3.4vh,44px);width:auto}
  .kicker{display:flex;align-items:center;gap:14px;font-family:var(--f-display);font-weight:600;font-size:clamp(14px,1.6vw,24px);letter-spacing:.2em;text-transform:uppercase;color:var(--lime)}
  .kicker .bars{width:clamp(18px,1.8vw,28px);height:clamp(14px,1.4vw,22px);background:linear-gradient(var(--lime) 0 27%,transparent 27% 36.5%,var(--lime) 36.5% 63.5%,transparent 63.5% 73%,var(--lime) 73% 100%)}
  .who{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:clamp(44px,8.5vw,140px);line-height:.95;margin-top:clamp(8px,1.4vh,18px);text-wrap:balance;overflow-wrap:anywhere}
  .what{font-size:clamp(20px,2.8vw,42px);color:var(--muted);margin-top:clamp(10px,2vh,22px);text-wrap:balance}
  .what b{color:var(--fg);font-weight:600}

  .foot{display:flex;gap:clamp(16px,3vw,40px);align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
  .upnext{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:clamp(16px,1.7vw,26px)}
  .upnext li{display:flex;gap:14px;align-items:center}
  .upnext .n{font-family:var(--f-mono);color:var(--lime);min-width:1.4em}
  .upnext .avatar{width:1.9em;height:1.9em;font-size:.7em}
  .upnext span.t{color:var(--muted)}
  .book{display:flex;gap:16px;align-items:center;background:var(--surface);border-left:6px solid var(--lime);padding:14px 18px 14px 14px;border-radius:4px}
  .book img{width:clamp(96px,10vw,160px);height:auto;border-radius:3px;background:#fff;padding:5px}
  .book b{display:block;font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(16px,1.6vw,26px)}
  .book span{color:var(--muted);font-family:var(--f-mono);font-size:clamp(12px,1.1vw,17px);overflow-wrap:anywhere}

  /* la chiamata sul palco: le tre barre della E attraversano lo schermo */
  .wipe{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:5vh;pointer-events:none;z-index:5}
  .wipe i{display:block;height:9vh;background:var(--lime);transform:scaleX(0);transform-origin:left}
  .calling .wipe i{animation:wipe 1.25s cubic-bezier(.7,0,.2,1) both}
  .calling .wipe i:nth-child(2){animation-delay:.08s}
  .calling .wipe i:nth-child(3){animation-delay:.16s}
  @keyframes wipe{0%{transform:scaleX(0);transform-origin:left}45%{transform:scaleX(1);transform-origin:left}55%{transform:scaleX(1);transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}
  .calling .hero > *{animation:reveal .7s .7s cubic-bezier(.2,.8,.2,1) both}
  .calling .hero > *:nth-child(2){animation-delay:.82s}
  @keyframes reveal{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}

  /* sovraimpressioni durante la canzone: negli angoli in alto, lontano dal testo del karaoke */
  .live{position:absolute;top:clamp(12px,2vw,28px);z-index:4;display:flex;align-items:center;gap:clamp(10px,1vw,16px);
    background:rgba(11,14,8,.84);border-radius:6px;padding:clamp(8px,.8vw,12px);transition:opacity .6s,transform .6s;pointer-events:none;
    box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .live.hide{opacity:0;transform:translateY(-12px)}
  .live-singer{left:clamp(12px,2vw,28px);border-left:5px solid var(--lime);max-width:min(46vw,620px);padding-right:clamp(14px,1.4vw,22px)}
  .live-singer .avatar{width:clamp(56px,7vh,96px);height:clamp(56px,7vh,96px);font-size:clamp(20px,2.6vh,34px);border:3px solid var(--lime);border-radius:5px;flex:none}
  .live-singer .txt{min-width:0}
  .live-singer .k{font-family:var(--f-display);font-weight:600;font-size:clamp(11px,1vw,15px);letter-spacing:.18em;text-transform:uppercase;color:var(--lime);display:flex;align-items:center;gap:8px}
  .live-singer .k::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px rgba(255,90,110,.25)}
  .live-singer .n{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:clamp(20px,2.4vw,40px);line-height:1.05;overflow-wrap:anywhere}
  .live-singer .s{color:var(--muted);font-size:clamp(13px,1.2vw,19px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live-singer .s b{color:var(--fg);font-weight:600}
  .live-qr{right:clamp(12px,2vw,28px);border-right:5px solid var(--lime);flex-direction:row-reverse;padding-left:clamp(12px,1.2vw,18px)}
  .live-qr img{width:clamp(84px,11vh,140px);height:auto;background:#fff;border-radius:3px;padding:4px;flex:none}
  .live-qr b{display:block;font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(13px,1.2vw,19px);line-height:1.15;text-align:right}
  .live-qr span{display:block;color:var(--lime);font-family:var(--f-display);font-weight:600;font-size:clamp(11px,1vw,15px);letter-spacing:.14em;text-transform:uppercase;text-align:right;margin-top:4px}
  .tools{position:absolute;right:16px;bottom:16px;display:flex;gap:8px;opacity:0;transition:opacity .3s;z-index:6}
  #stage:hover .tools{opacity:1}
  .start{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:30;padding:16px}
  .start .card{max-width:440px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
  .start .brand{font-size:26px;justify-content:center}

  /* ---- voto: invito durante la canzone ---- */
  .live-singer .vote-live{margin-top:6px;display:inline-flex;align-items:center;gap:8px;padding:3px 10px;border-radius:3px;background:var(--lime);color:var(--on-lime);font-family:var(--f-display);font-weight:700;font-size:clamp(12px,1.1vw,17px);letter-spacing:.06em;text-transform:uppercase}

  /* pulsante di emergenza: piccolo, rotondo, in basso a sinistra */
  .tap-play{position:fixed;left:clamp(14px,1.6vw,24px);bottom:clamp(14px,1.6vw,24px);z-index:15;width:clamp(44px,4.6vw,64px);aspect-ratio:1;border:0;border-radius:50%;background:var(--lime);color:var(--on-lime);
    font-family:var(--f-display);font-weight:700;font-size:clamp(22px,2.4vw,34px);line-height:1;cursor:pointer;display:grid;place-items:center;animation:tapPulse 1.6s ease-in-out infinite}
  @keyframes tapPulse{0%,100%{box-shadow:0 0 0 0 rgba(138,203,44,.55)}50%{box-shadow:0 0 0 12px rgba(138,203,44,0)}}
  .tap-play[hidden]{display:none}
  /* ---- classifica ---- */
  .board{list-style:none;margin:clamp(14px,2.4vh,28px) 0 0;padding:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,12px);max-width:1100px}
  .board li{display:grid;grid-template-columns:clamp(44px,4vw,72px) minmax(0,1fr) auto;gap:clamp(12px,1.4vw,24px);align-items:center;padding:clamp(8px,1.1vh,14px) clamp(12px,1.2vw,20px);background:rgba(23,27,17,.82);border-left:5px solid var(--line);border-radius:4px}
  .board li:first-child{border-left-color:var(--lime);background:rgba(138,203,44,.14)}
  .board .p{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,2.6vw,44px);color:var(--muted);text-align:center}
  .board li:first-child .p{color:var(--lime)}
  .board .nm{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:clamp(18px,2vw,34px);line-height:1.1;overflow-wrap:anywhere}
  .board .tt{color:var(--muted);font-size:clamp(13px,1.2vw,19px)}
  .board .sc{text-align:right;font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.2vw,38px)}
  .board .sc small{display:block;font-family:var(--f-body);font-weight:500;font-size:clamp(11px,1vw,15px);color:var(--muted)}

  /* ---- pop-up esplosivo dell'esito ---- */
  .burst{position:fixed;inset:0;z-index:20;display:grid;place-items:center;overflow:hidden;cursor:pointer;
    --c1:#8acb2c;--c2:#0b0e08;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--c1) 55%,#000) 0%,var(--c2) 70%)}
  .burst[hidden]{display:none}
  .burst .rays{position:absolute;width:250vmax;height:250vmax;left:50%;top:45%;translate:-50% -50%;opacity:0;
    background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.10) 0deg 7deg,transparent 7deg 18deg);animation:spin 14s linear infinite,fadein .6s .2s forwards}
  .burst canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .burst .card{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vh,18px);padding:24px;animation:boom .75s cubic-bezier(.2,1.5,.35,1) both}
  .burst .face{width:clamp(110px,20vh,220px);aspect-ratio:1;border-radius:50%;background:var(--surface-2) center/cover no-repeat;border:6px solid #fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:clamp(40px,8vh,90px);color:var(--c1);box-shadow:0 0 0 10px rgba(0,0,0,.25),0 0 90px color-mix(in srgb,var(--c1) 70%,transparent)}
  .burst .claps{font-size:clamp(40px,7.5vh,90px);letter-spacing:.06em;line-height:1}
  .burst .claps span{display:inline-block;animation:clap .45s cubic-bezier(.2,1.8,.4,1) both}
  .burst .claps span.off{opacity:.16;filter:grayscale(1)}
  .burst .lv{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:.92;font-size:clamp(56px,11vw,190px);color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.25),0 0 60px color-mix(in srgb,var(--c1) 80%,transparent);text-wrap:balance}
  .burst .who{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(20px,2.6vw,42px);margin:0;color:#fff}
  .burst .meta{font-size:clamp(16px,1.8vw,28px);color:rgba(255,255,255,.8)}
  .burst .meta b{color:#fff}
  .burst .kick{font-family:var(--f-display);font-weight:600;letter-spacing:.24em;text-transform:uppercase;font-size:clamp(14px,1.6vw,24px);color:var(--c1);background:rgba(0,0,0,.35);padding:6px 16px;border-radius:3px}
  .burst .podium{display:flex;gap:clamp(12px,2vw,32px);justify-content:center;margin-top:8px;font-size:clamp(14px,1.5vw,22px);color:rgba(255,255,255,.85)}
  .burst.lv1{--c1:#6f86a6;--c2:#07090c}
  .burst.lv1 .card{animation:boom .7s both,shake .5s .8s 2}
  .burst.lv2{--c1:#8b9180;--c2:#0a0b09}
  .burst.lv5 .lv,.burst.win .lv{animation:pulse 1.1s ease-in-out infinite}
  .burst.win{--c1:#f5c542}
  @keyframes boom{0%{transform:scale(.2) rotate(-6deg);opacity:0}60%{opacity:1}100%{transform:none}}
  @keyframes clap{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
  @keyframes spin{to{rotate:360deg}}
  @keyframes fadein{to{opacity:1}}
  @keyframes shake{25%{translate:-14px 0}75%{translate:14px 0}}
  @keyframes pulse{50%{transform:scale(1.06)}}
  @media (prefers-reduced-motion:reduce){.calling .wipe i{animation:none}.calling .hero > *{animation:none}}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <form class="card" id="gateForm">
    <div><div class="brand"><span>Schermo</span><img class="logo" src="/logo.png" alt="Lopee J"></div><div class="brand-sub">Canta con Lopee J!</div></div>
    <div class="field"><label for="pin">PIN della regia</label><input type="password" id="pin" autocomplete="current-password" required></div>
    <div class="err-text" id="gateErr"></div>
    <button class="btn primary big" type="submit">Collega</button>
  </form>
</div>

<div class="start" id="start" hidden>
  <div class="card">
    <div class="brand" id="startBrand"></div>
    <p style="margin:0;color:var(--muted)">Premi il pulsante per attivare video e audio, poi porta questa finestra sul proiettore a schermo intero.</p>
    <button class="btn primary big" id="startBtn">Attiva schermo</button>
  </div>
</div>

<div id="stage">
  <div id="bgwrap"><div id="bgplayer"></div></div>
  <div id="player"></div>
  <div class="live live-singer hide" id="liveSinger" aria-live="polite"></div>
  <div class="live live-qr hide" id="liveQr"><img src="/qr.svg" alt="QR code per prenotare"><div><b>Vuoi cantare?</b><b>Inquadra e prenota</b><span id="liveQrSub">Canta con Lopee J!</span></div></div>
  <div class="overlay" id="overlay">
    <div class="brand" id="nightName"></div>
    <div class="hero" id="hero"></div>
    <div class="foot">
      <div id="nextBox"></div>
      <div class="book"><img src="/qr.svg" alt=""><div><b>Prenota la tua canzone</b><span id="guestUrl"></span></div></div>
    </div>
    <div class="wipe" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
  <div class="tools"><button class="btn sm" id="fsBtn">Schermo intero</button></div>
</div>
<button class="tap-play" id="tapPlay" hidden type="button" title="Clicca per far partire la base" aria-label="Clicca per far partire la base">!</button>
<div class="burst" id="burst" hidden role="dialog" aria-live="assertive"><div class="rays"></div><canvas id="confetti"></canvas><div class="card" id="burstCard"></div></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script>
(function () {
  const { $, esc, store, brandHTML, avatarHTML, initials } = K;
  let S = null, socket = null, yt = null, ready = false, loadedId = null, pending = null, ytState = "idle";
  let celebrate = null, lastCalledId = null;
  // musica d'attesa
  let bg = null, bgReady = false, bgKey = null, bgPlaying = false, bgFirst = true, bgManualPause = false, songStarted = false, fadeTimer = null, fading = false, bgVol = 0;
  $("#startBrand").innerHTML = brandHTML("Canta con Lopee J!");
  $("#nightName").innerHTML = brandHTML("Canta con Lopee J!");

  fetch("/api/info").then((r) => r.json()).then((i) => { $("#guestUrl").textContent = i.guestUrl.replace(/^https?:\/\//, "").replace(/\/$/, ""); }).catch(() => {});

  function connect(pin) {
    socket = io({ auth: { role: "screen", pin } });
    socket.on("connect", () => { store.set("karaoke-pin", pin); $("#gate").hidden = true; if (!yt) $("#start").hidden = false; });
    socket.on("connect_error", (e) => { if (e.message === "pin") { store.del("karaoke-pin"); $("#gate").hidden = false; $("#gateErr").textContent = "PIN sbagliato."; socket.close(); } });
    socket.on("state", (s) => { S = s; render(); });
    socket.on("player:load", (d) => { pending = d; applyLoad(); });
    socket.on("player:cmd", (c) => command(c));
    socket.on("filler:cmd", (c) => fillerCommand(c));
    socket.on("vote:result", (r) => showResult(r));
    socket.on("vote:winner", (w) => showWinner(w));
  }
  $("#gateForm").addEventListener("submit", (e) => { e.preventDefault(); connect($("#pin").value); });
  const saved = store.get("karaoke-pin"); if (saved) connect(saved); else $("#gate").hidden = false;

  // ---------- player YouTube ----------
  $("#startBtn").onclick = () => {
    $("#start").hidden = true;
    audio(); if (actx && actx.state === "suspended") actx.resume();
    const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s);
    try { document.documentElement.requestFullscreen(); } catch {}
  };
  window.onYouTubeIframeAPIReady = () => {
    yt = new YT.Player("player", {
      width: "100%", height: "100%",
      playerVars: { rel: 0, playsinline: 1, modestbranding: 1, iv_load_policy: 3, controls: 1, fs: 0 },
      events: {
        onReady: () => { ready = true; applyLoad(); setInterval(report, 1000); },
        onStateChange: (e) => {
          const map = { "-1": "unstarted", 0: "ended", 1: "playing", 2: "paused", 3: "buffering", 5: "cued" };
          ytState = map[e.data] || "idle";
          if (ytState === "playing") { songStarted = true; clearTimeout(playCheck); $("#tapPlay").hidden = true; }
          if (ytState === "ended" && S?.current) celebrate = { ...S.current };
          if (ytState === "playing") celebrate = null;
          render(); report();
        },
        onError: (e) => { socket.emit("screen:error", { videoId: loadedId, code: e.data }); }
      }
    });
    bg = new YT.Player("bgplayer", {
      width: "100%", height: "100%",
      playerVars: { rel: 0, playsinline: 1, controls: 0, modestbranding: 1, iv_load_policy: 3, fs: 0 },
      events: {
        onReady: () => { bgReady = true; applyFiller(); },
        onStateChange: (e) => {
          // un video singolo ricomincia da capo
          if (e.data === 0 && !fillerCfg().listId && bgPlaying) { bg.seekTo(0, true); bg.playVideo(); }
        },
        onError: () => { if (fillerCfg().listId && bgPlaying) bg.nextVideo(); }
      }
    });
  };

  // ---------- musica d'attesa ----------
  const fillerCfg = () => (S && S.settings && S.settings.filler) || {};
  function fade(to, ms, done) {
    clearInterval(fadeTimer); fading = true;
    const from = bgVol, steps = Math.max(1, Math.round(ms / 50)); let i = 0;
    fadeTimer = setInterval(() => {
      i++; bgVol = from + (to - from) * i / steps;
      try { bg.setVolume(Math.round(bgVol)); } catch {}
      if (i >= steps) { clearInterval(fadeTimer); fading = false; if (done) done(); }
    }, 50);
  }
  function loadFillerSource() {
    const f = fillerCfg(); const key = (f.listId || "") + "|" + (f.videoId || "");
    if (key === bgKey) return;
    bgKey = key; bgPlaying = false; bgFirst = true;
    if (f.listId) bg.cuePlaylist({ list: f.listId, listType: "playlist", index: 0 });
    else if (f.videoId) bg.cueVideoById(f.videoId);
    else bg.stopVideo();
  }
  // suona quando il palco è libero, mentre la base è caricata ma non ancora partita, o a fine canzone
  function shouldFill() {
    const f = fillerCfg();
    if (!f.enabled || (!f.videoId && !f.listId) || bgManualPause) return false;
    if (!S || !S.current || !loadedId) return true;
    if (ytState === "playing" || ytState === "buffering") return false;
    if (ytState === "ended") return true;
    return !songStarted;
  }
  function applyFiller() {
    if (!bgReady || !S) return;
    loadFillerSource();
    const want = shouldFill(), vol = (fillerCfg().volume ?? 60) * (duck ? 0.25 : 1);
    if (want && !bgPlaying) {
      bgPlaying = true; bgVol = 0; bg.setVolume(0);
      const pl = fillerCfg().listId && bgFirst ? bg.getPlaylist?.() : null;
      if (pl && pl.length) { try { bg.setShuffle(true); bg.setLoop(true); } catch {} bg.playVideoAt(Math.floor(Math.random() * pl.length)); }
      else { bg.playVideo(); if (fillerCfg().listId) setTimeout(() => { try { bg.setShuffle(true); bg.setLoop(true); } catch {} }, 1500); }
      bgFirst = false;
      fade(vol, 2500); showFillerVideo();
    } else if (want && bgPlaying && !fading && Math.abs(bgVol - vol) > 1) {
      fade(vol, 500);
    } else if (!want && bgPlaying) {
      bgPlaying = false; showFillerVideo();
      fade(0, 1200, () => { if (!bgPlaying) bg.pauseVideo(); });
    }
  }
  // mentre suona la musica d'attesa il suo video si vede in trasparenza
  function showFillerVideo() {
    const vis = Math.max(0, Math.min(90, fillerCfg().visibility ?? 45));
    const on = bgPlaying && vis > 0 && !(ytState === "playing" || ytState === "buffering");
    $("#player").classList.toggle("behind", on);
    const ov = $("#overlay");
    ov.classList.toggle("see-through", on);
    ov.style.setProperty("--dim", on ? (1 - vis / 100).toFixed(2) : ".94");
  }
  function fillerCommand(c) {
    if (!bgReady) return;
    if (c.cmd === "skip") { if (fillerCfg().listId) bg.nextVideo(); else bg.seekTo(0, true); }
    if (c.cmd === "pause") bgManualPause = true;
    if (c.cmd === "resume") bgManualPause = false;
    applyFiller(); report();
  }
  function applyLoad() {
    if (!ready || !pending) return;
    const { videoId, autoplay } = pending; pending = null;
    if (!videoId) { if (loadedId) yt.stopVideo(); loadedId = null; ytState = "idle"; render(); return; }
    if (videoId === loadedId) return;
    loadedId = videoId; celebrate = null; songStarted = false;
    autoplay ? yt.loadVideoById(videoId) : yt.cueVideoById(videoId);
  }
  let playCheck = null;
  function command(c) {
    if (!ready) { if (c.cmd === "play") socket.emit("screen:problem", "notActive"); return; }
    if (!loadedId) { if (c.cmd === "play") socket.emit("screen:problem", "noVideo"); return; }
    if (c.cmd === "play") {
      // la musica d'attesa sfuma mentre parte la base
      if (bgPlaying) { bgPlaying = false; showFillerVideo(); fade(0, 900, () => { if (!bgPlaying) bg.pauseVideo(); }); }
      yt.playVideo();
      // se il browser blocca l'avvio automatico, chiedi un clic sullo schermo
      clearTimeout(playCheck);
      playCheck = setTimeout(() => {
        if (ytState !== "playing" && ytState !== "buffering") { $("#tapPlay").hidden = false; socket.emit("screen:problem", "blocked"); }
      }, 4000);
    }
    if (c.cmd === "pause") yt.pauseVideo();
    if (c.cmd === "restart") { yt.seekTo(0, true); yt.playVideo(); }
    if (c.cmd === "seek") yt.seekTo(Math.max(0, yt.getCurrentTime() + (+c.value || 0)), true);
  }
  function report() {
    if (!socket || !ready) return;
    let title = ""; try { title = bgPlaying ? (bg.getVideoData?.().title || "") : ""; } catch {}
    socket.emit("screen:status", { videoId: loadedId, state: loadedId ? ytState : "idle", time: yt.getCurrentTime?.() || 0, duration: yt.getDuration?.() || 0, filler: { playing: bgPlaying, title, paused: bgManualPause } });
  }
  // foto e nome di chi canta + QR, sempre visibili mentre va la canzone
  function renderLive(on) {
    const cur = S && S.current, next = (S && S.next) || [];
    const box = $("#liveSinger");
    if (on && cur) {
      box.innerHTML = `${avatarHTML(cur)}<div class="txt"><div class="k">Sta cantando</div><div class="n">${esc(cur.singer)}</div><div class="s"><b>${esc(cur.title)}</b>${cur.artist ? " · " + esc(cur.artist) : ""}</div>${next[0] ? `<div class="s">Dopo: <b>${esc(next[0].singer)}</b></div>` : ""}${cur.voteOpen ? `<div class="vote-live">👏 Vota dal telefono · ${cur.votes} ${cur.votes === 1 ? "voto" : "voti"}</div>` : ""}</div>`;
    }
    const q = $("#liveQr div");
    q.innerHTML = cur && cur.voteOpen
      ? `<b>Vota l'esibizione</b><b>Inquadra il QR</b><span>${cur.votes} ${cur.votes === 1 ? "voto" : "voti"}</span>`
      : `<b>Vuoi cantare?</b><b>Inquadra e prenota</b><span>${esc(S.settings.name)}</span>`;
    box.classList.toggle("hide", !(on && cur));
    $("#liveQr").classList.toggle("hide", !on);
  }


  // ---------- grafica ----------
  const kicker = (t) => `<div class="kicker"><span class="bars"></span>${esc(t)}</div>`;
  const pic = (item) => item.selfie
    ? `<div class="pic" style="background-image:url('${esc(item.selfie)}')" role="img" aria-label="Selfie di ${esc(item.singer)}"></div>`
    : `<div class="pic" aria-hidden="true">${esc(initials(item.singer))}</div>`;

  function render() {
    if (!S) return;
    $("#nightName").innerHTML = brandHTML(S.settings.name);
    const cur = S.current, next = S.next || [];
    const playing = ytState === "playing" || ytState === "buffering";
    const ov = $("#overlay");
    ov.classList.toggle("hide", playing && !!cur);
    renderLive(playing && !!cur && S.settings.liveOverlay !== false);
    showFillerVideo();

    // nuovo cantante chiamato sul palco: parte l'animazione
    if (cur && cur.id !== lastCalledId) {
      lastCalledId = cur.id;
      ov.classList.remove("calling"); void ov.offsetWidth; ov.classList.add("calling");
      setTimeout(() => ov.classList.remove("calling"), 2200);
    }
    if (!cur) lastCalledId = null;

    const hero = $("#hero");
    if (S.settings.showRanking && (S.ranking || []).length) {
      hero.className = "hero no-pic";
      hero.innerHTML = `<div>${kicker("Classifica della serata")}<ol class="board">${S.ranking.map((r, i) => `<li><span class="p">${i + 1}</span><div><div class="nm">${esc(r.singer)}</div><div class="tt">${esc(r.title)}${r.artist ? " · " + esc(r.artist) : ""}</div></div><div class="sc">${String(r.avg).replace(".", ",")} 👏<small>${r.count} voti</small></div></li>`).join("")}</ol></div>`;
    } else if (celebrate) {
      hero.className = "hero";
      hero.innerHTML = `${pic(celebrate)}<div>${kicker("Un applauso per")}<div class="who">${esc(celebrate.singer)}</div>${next[0] ? `<div class="what">Ora tocca a <b>${esc(next[0].singer)}</b></div>` : ""}</div>`;
    } else if (cur) {
      hero.className = "hero";
      hero.innerHTML = `${pic(cur)}<div>${kicker("Sul palco")}<div class="who">${esc(cur.singer)}</div><div class="what"><b>${esc(cur.title)}</b>${cur.artist ? " · " + esc(cur.artist) : ""}</div></div>`;
    } else {
      hero.className = "hero no-pic";
      hero.innerHTML = `<div>${kicker(S.settings.open ? "Il palco è libero" : "Prenotazioni chiuse")}<div class="who">${S.settings.open ? "Chi canta?" : "Grazie a tutti!"}</div><div class="what">${S.settings.open ? "Inquadra il QR, scegli la canzone e fatti un selfie: <b>ti chiamiamo sul palco</b>." : "Alla prossima serata con <b>Lopee J</b>."}</div>
        <div class="dj-banner"><div class="faces"><span class="face" style="background-image:url('/dj-faccia-2.jpg')" role="img" aria-label="Lopee J"></span><span class="face mic"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="micGrille"><path d="M39 40V21a11 11 0 0 1 22 0v19z"/></clipPath></defs><g fill="none" stroke="#8acb2c" stroke-linecap="round" stroke-linejoin="round"><path d="M29 57a21 6.5 0 0 1 42 0" stroke-width="2.6" opacity=".55"/><path d="M50 63.5V84M38 87h24" stroke-width="3.4"/><path d="M39 40V21a11 11 0 0 1 22 0v19z" fill="#141b0d" stroke-width="3"/><g clip-path="url(#micGrille)" stroke-width="1.6" opacity=".9"><path d="M30 14l30 30M30 22l30 30M30 30l30 30M30 6l30 30M38 2l30 30M70 14L40 44M70 22L40 52M70 6L40 36M62 2L32 32"/></g><path d="M39 44v20a4 4 0 0 0 4 4h14a4 4 0 0 0 4-4V44z" fill="#141b0d" stroke-width="3"/><path d="M45 68v4h10v-4" stroke-width="2.6"/><path d="M29 57a21 6.5 0 0 0 42 0" stroke-width="3"/><path d="M29.5 57l9.5-3M70.5 57l-9.5-3" stroke-width="1.6" opacity=".8"/></g><rect x="37.5" y="39" width="25" height="5.5" rx="1.5" fill="#8acb2c"/><circle cx="50" cy="51" r="2.4" fill="#8acb2c"/></svg></span></div><div><span class="k">Stasera alla console</span><img class="logo" src="/logo.png" alt="Lopee J"></div></div></div>`;
    }
    applyFiller();
    $("#nextBox").innerHTML = next.length ? `${kicker("Prossimi")}<ol class="upnext">${next.slice(0, 4).map((q, i) => `<li><span class="n">${i + 1}</span>${avatarHTML(q)}<div><b>${esc(q.singer)}</b> <span class="t">· ${esc(q.title)}</span></div></li>`).join("")}</ol>` : "";
  }


  // ---------- voto: pop-up esplosivo con suono ----------
  let actx = null, master = null, noise = null, burstTimer = null, duck = false;
  function audio() {
    if (actx) return actx;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 0.7; master.connect(actx.destination);
      const len = actx.sampleRate * 0.5; noise = actx.createBuffer(1, len, actx.sampleRate);
      const d = noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch { actx = null; }
    return actx;
  }
  function clap(t, g) {
    const src = actx.createBufferSource(); src.buffer = noise;
    const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 900 + Math.random() * 1600; bp.Q.value = 0.9;
    const env = actx.createGain(); env.gain.setValueAtTime(0, t); env.gain.linearRampToValueAtTime(g, t + 0.002); env.gain.exponentialRampToValueAtTime(0.001, t + 0.09 + Math.random() * 0.05);
    src.connect(bp); bp.connect(env); env.connect(master); src.start(t, Math.random() * 0.4, 0.2);
  }
  function applause(dur, perSec, g) {
    const t0 = actx.currentTime;
    for (let i = 0; i < dur * perSec; i++) {
      const t = t0 + Math.random() * dur, edge = Math.min(1, (t - t0) / 0.6, (t0 + dur - t) / 1.2);
      clap(t, g * (0.4 + Math.random() * 0.6) * Math.max(0.05, edge));
    }
  }
  function tone(f, t, dur, type, g, f2) {
    const o = actx.createOscillator(), env = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.linearRampToValueAtTime(f2, t + dur);
    env.gain.setValueAtTime(0, t); env.gain.linearRampToValueAtTime(g, t + 0.02); env.gain.setValueAtTime(g, t + dur * 0.7); env.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(env); env.connect(master); o.start(t); o.stop(t + dur + 0.05);
    return o;
  }
  function playLevel(level) {
    if (!audio()) return;
    if (actx.state === "suspended") actx.resume();
    const t = actx.currentTime + 0.05;
    if (level === 1) { // trombone triste
      [[233, 0, .45], [220, .5, .45], [208, 1, .45]].forEach(([f, d, l]) => tone(f, t + d, l, "sawtooth", .16));
      const o = tone(196, t + 1.5, 1.6, "sawtooth", .16);
      const lfo = actx.createOscillator(), lg = actx.createGain(); lfo.frequency.value = 6; lg.gain.value = 6; lfo.connect(lg); lg.connect(o.frequency); lfo.start(t + 1.6); lfo.stop(t + 3.2);
    } else if (level === 2) { // "mah"
      tone(330, t, .35, "square", .07); tone(311, t + .42, .6, "square", .07);
      applause(1.6, 6, .25);
    } else if (level === 3) {
      [523, 659, 784].forEach((f, i) => tone(f, t + i * .12, .5, "triangle", .14));
      applause(3, 28, .5);
    } else if (level === 4) {
      [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * .13, .4, "square", .07));
      [523, 659, 784].forEach((f) => tone(f, t + .55, 1.1, "sawtooth", .05));
      applause(5, 55, .6);
    } else { // standing ovation / vincitore
      [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * .11, .35, "square", .08));
      [523, 659, 784, 1047].forEach((f) => tone(f, t + .6, 1.6, "sawtooth", .05));
      tone(1047, t + .6, 1.6, "triangle", .08);
      applause(7, 95, .7);
      setTimeout(() => actx && applause(4, 60, .5), 3000);
    }
  }
  // coriandoli verdi, bianchi e oro
  function confetti(n, rain) {
    const cv = $("#confetti"), cx = cv.getContext("2d");
    const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio, k = devicePixelRatio;
    const cols = rain ? ["#6f86a6", "#4d5b70"] : ["#8acb2c", "#b7f05a", "#ffffff", "#f5c542"];
    const ps = Array.from({ length: n }, () => rain
      ? { x: Math.random() * W, y: -Math.random() * H, vx: 0, vy: (2 + Math.random() * 3) * k, w: 2 * k, h: 14 * k, r: 0, vr: 0, c: cols[Math.random() * 2 | 0] }
      : { x: W / 2 + (Math.random() - .5) * W * .2, y: H * .55, vx: (Math.random() - .5) * 26 * k, vy: -(10 + Math.random() * 20) * k, w: (6 + Math.random() * 8) * k, h: (8 + Math.random() * 12) * k, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.random() * cols.length | 0] });
    let frames = 0; cancelAnimationFrame(confetti.raf);
    (function step() {
      cx.clearRect(0, 0, W, H);
      for (const p of ps) {
        if (!rain) { p.vy += .45 * k; p.vx *= .99; }
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        if (rain && p.y > H) p.y = -20;
        cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, Math.abs(Math.cos(p.r)) * p.h + 1); cx.restore();
      }
      if (++frames < 420 && !$("#burst").hidden) confetti.raf = requestAnimationFrame(step); else cx.clearRect(0, 0, W, H);
    })();
  }
  function openBurst(cls, html, level, ms) {
    const b = $("#burst");
    b.className = "burst " + cls; $("#burstCard").innerHTML = html; b.hidden = false;
    duck = true; applyFiller();
    playLevel(level);
    const counts = [0, 70, 0, 80, 170, 300];
    if (level === 1) confetti(counts[1], true); else if (counts[level]) confetti(counts[level], false);
    clearTimeout(burstTimer); burstTimer = setTimeout(closeBurst, ms);
  }
  function closeBurst() { $("#burst").hidden = true; duck = false; applyFiller(); }
  $("#burst").onclick = closeBurst;
  $("#tapPlay").onclick = () => { $("#tapPlay").hidden = true; audio(); if (actx && actx.state === "suspended") actx.resume(); if (ready && loadedId) yt.playVideo(); };
  const faceHTML = (r) => r.selfie ? `<div class="face" style="background-image:url('${esc(r.selfie)}')"></div>` : `<div class="face">${esc(initials(r.singer))}</div>`;
  const clapRow = (lv) => [1, 2, 3, 4, 5].map((i) => `<span class="${i <= lv ? "" : "off"}" style="animation-delay:${0.35 + i * 0.12}s">👏</span>`).join("");
  function showResult(r) {
    openBurst("lv" + r.level, `${faceHTML(r)}<div class="claps">${clapRow(r.level)}</div><div class="lv">${esc(r.label)}</div>
      <p class="who">${esc(r.singer)}</p><div class="meta">Media <b>${String(r.avg).replace(".", ",")}</b> su 5 · <b>${r.count}</b> ${r.count === 1 ? "voto" : "voti"}</div>`, r.level, 9000);
  }
  function showWinner(w) {
    const p = w.podium || [];
    openBurst("win lv5", `<div class="kick">🏆 Vincitore della serata</div><div class="claps">🏆</div><div class="lv">${esc(w.winner.singer)}</div>
      <div class="meta"><b>${esc(w.winner.title)}</b> · media <b>${String(w.winner.avg).replace(".", ",")}</b> su 5 · ${w.winner.count} voti</div>
      ${p.length > 1 ? `<div class="podium">${p.slice(1).map((r, i) => `<span>${i + 2}° ${esc(r.singer)} · ${String(r.avg).replace(".", ",")}</span>`).join("")}</div>` : ""}`, 5, 20000);
  }

  $("#fsBtn").onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch {} };
})();
</script>
</body>
