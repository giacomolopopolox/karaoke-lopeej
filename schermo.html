<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Schermo · Karaoke Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  /* Lo schermo resta sempre scuro: è pensato per proiettore e TV in sala */
  :root{--bg:#0e0a13;--surface:#1f1729;--surface-2:#2a2036;--line:#3a2e49;--fg:#f3ecfa;--muted:#a898b8;--bulb:#f2ae4b;--mag:#ef6aa5;--mag-soft:#3d1a2c;color-scheme:dark}
  html,body{height:100%;overflow:hidden;background:#000}
  #stage{position:fixed;inset:0;background:#000}
  #player,#player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(20px,4vw,56px);
    background:radial-gradient(ellipse at 20% 0%,rgba(242,174,75,.22),transparent 55%),rgba(14,10,19,.86);transition:opacity .4s}
  .overlay.hide{opacity:0;pointer-events:none}
  .marquee{font-family:var(--f-display);color:var(--bulb);font-size:clamp(22px,3vw,40px);text-shadow:0 0 22px rgba(242,174,75,.5)}
  .hero .label{font-size:clamp(12px,1.3vw,18px)}
  .hero .who{font-family:var(--f-display);font-size:clamp(40px,8vw,120px);line-height:1;color:var(--fg);margin-top:10px;text-wrap:balance;overflow-wrap:anywhere}
  .hero .what{font-size:clamp(20px,3vw,40px);color:var(--muted);margin-top:14px;text-wrap:balance}
  .hero .what b{color:var(--fg)}
  .foot{display:flex;gap:clamp(16px,3vw,40px);align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
  .upnext{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:clamp(16px,1.8vw,26px)}
  .upnext li{display:flex;gap:14px;align-items:baseline}
  .upnext .n{font-family:var(--f-mono);color:var(--bulb);min-width:1.6em}
  .upnext span{color:var(--muted)}
  .book{display:flex;gap:16px;align-items:center;background:rgba(255,255,255,.06);padding:12px;border-radius:14px}
  .book img{width:clamp(96px,10vw,150px);height:auto;border-radius:8px;background:#fff;padding:5px}
  .book b{display:block;font-size:clamp(16px,1.6vw,24px)}
  .book span{color:var(--muted);font-family:var(--f-mono);font-size:clamp(12px,1.1vw,16px);overflow-wrap:anywhere}
  .badge{position:absolute;top:clamp(12px,2vw,28px);left:clamp(12px,2vw,28px);display:flex;gap:10px;align-items:center;padding:10px 18px;border-radius:999px;background:rgba(14,10,19,.82);font-weight:700;font-size:clamp(16px,1.8vw,26px);color:var(--mag);transition:opacity .6s;pointer-events:none}
  .badge.hide{opacity:0}
  .tools{position:absolute;right:16px;bottom:16px;display:flex;gap:8px;opacity:0;transition:opacity .3s}
  #stage:hover .tools{opacity:1}
  .start{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:30;padding:16px}
  .start .card{max-width:420px;text-align:center;display:flex;flex-direction:column;gap:14px}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <form class="card" id="gateForm">
    <div class="sign">Schermo<small>Karaoke Night</small></div>
    <div class="field"><label for="pin">PIN della regia</label><input type="password" id="pin" autocomplete="current-password" required></div>
    <div class="err-text" id="gateErr"></div>
    <button class="btn primary big" type="submit">Collega</button>
  </form>
</div>

<div class="start" id="start" hidden>
  <div class="card">
    <div class="sign">Schermo pronto</div>
    <p style="margin:0;color:var(--muted)">Premi il pulsante per attivare video e audio, poi porta questa finestra sul proiettore e mettila a schermo intero.</p>
    <button class="btn primary big" id="startBtn">Attiva schermo</button>
  </div>
</div>

<div id="stage">
  <div id="player"></div>
  <div class="badge hide" id="badge"></div>
  <div class="overlay" id="overlay">
    <div class="marquee" id="nightName">Karaoke Night</div>
    <div class="hero" id="hero"></div>
    <div class="foot">
      <div id="nextBox"></div>
      <div class="book"><img src="/qr.svg" alt=""><div><b>Prenota la tua canzone</b><span id="guestUrl"></span></div></div>
    </div>
  </div>
  <div class="tools"><button class="btn sm" id="fsBtn">Schermo intero</button></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script>
(function () {
  const { $, esc, store } = K;
  let S = null, socket = null, yt = null, ready = false, loadedId = null, pending = null, ytState = "idle", celebrate = null, badgeTimer = null;

  fetch("/api/info").then((r) => r.json()).then((i) => { $("#guestUrl").textContent = i.guestUrl.replace(/^https?:\/\//, "").replace(/\/$/, ""); }).catch(() => {});

  function connect(pin) {
    socket = io({ auth: { role: "screen", pin } });
    socket.on("connect", () => { store.set("karaoke-pin", pin); $("#gate").hidden = true; if (!yt) $("#start").hidden = false; });
    socket.on("connect_error", (e) => { if (e.message === "pin") { store.del("karaoke-pin"); $("#gate").hidden = false; $("#gateErr").textContent = "PIN sbagliato."; socket.close(); } });
    socket.on("state", (s) => { S = s; render(); });
    socket.on("player:load", (d) => { pending = d; applyLoad(); });
    socket.on("player:cmd", (c) => command(c));
  }
  $("#gateForm").addEventListener("submit", (e) => { e.preventDefault(); connect($("#pin").value); });
  const saved = store.get("karaoke-pin"); if (saved) connect(saved); else $("#gate").hidden = false;

  // ---------- player YouTube ----------
  $("#startBtn").onclick = () => {
    $("#start").hidden = true;
    const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s);
    try { document.documentElement.requestFullscreen(); } catch {}
  };
  window.onYouTubeIframeAPIReady = () => {
    yt = new YT.Player("player", {
      width: "100%", height: "100%",
      playerVars: { rel: 0, playsinline: 1, modestbranding: 1, iv_load_policy: 3, controls: 1, fs: 0 },
      events: {
        onReady: () => { ready = true; applyLoad(); setInterval(report, 1000); },
        onStateChange: (e) => {
          const map = { "-1": "unstarted", 0: "ended", 1: "playing", 2: "paused", 3: "buffering", 5: "cued" };
          ytState = map[e.data] || "idle";
          if (ytState === "ended" && S?.current) celebrate = S.current.singer;
          if (ytState === "playing") { celebrate = null; showBadge(); }
          render(); report();
        },
        onError: (e) => { socket.emit("screen:error", { videoId: loadedId, code: e.data }); }
      }
    });
  };
  function applyLoad() {
    if (!ready || !pending) return;
    const { videoId, autoplay } = pending; pending = null;
    if (!videoId) { if (loadedId) yt.stopVideo(); loadedId = null; ytState = "idle"; render(); return; }
    if (videoId === loadedId) return;
    loadedId = videoId; celebrate = null;
    autoplay ? yt.loadVideoById(videoId) : yt.cueVideoById(videoId);
  }
  function command(c) {
    if (!ready || !loadedId) return;
    if (c.cmd === "play") yt.playVideo();
    if (c.cmd === "pause") yt.pauseVideo();
    if (c.cmd === "restart") { yt.seekTo(0, true); yt.playVideo(); }
    if (c.cmd === "seek") yt.seekTo(Math.max(0, yt.getCurrentTime() + (+c.value || 0)), true);
  }
  function report() {
    if (!socket || !ready) return;
    socket.emit("screen:status", { videoId: loadedId, state: loadedId ? ytState : "idle", time: yt.getCurrentTime?.() || 0, duration: yt.getDuration?.() || 0 });
  }
  function showBadge() {
    const cur = S?.current; if (!cur) return;
    const b = $("#badge"); b.textContent = "🎤 " + cur.singer; b.classList.remove("hide");
    clearTimeout(badgeTimer); badgeTimer = setTimeout(() => b.classList.add("hide"), 8000);
  }

  // ---------- grafica ----------
  function render() {
    if (!S) return;
    $("#nightName").textContent = S.settings.name;
    const cur = S.current, next = S.next || [];
    const playing = ytState === "playing" || ytState === "buffering";
    $("#overlay").classList.toggle("hide", playing && !!cur);
    if (celebrate) {
      $("#hero").innerHTML = `<div class="label">Un applauso per</div><div class="who">${esc(celebrate)}</div>${next[0] ? `<div class="what">Ora tocca a <b>${esc(next[0].singer)}</b></div>` : ""}`;
    } else if (cur) {
      $("#hero").innerHTML = `<div class="label">Sul palco</div><div class="who">${esc(cur.singer)}</div><div class="what"><b>${esc(cur.title)}</b>${cur.artist ? " · " + esc(cur.artist) : ""}</div>`;
    } else {
      $("#hero").innerHTML = `<div class="label">${S.settings.open ? "Il palco è libero" : "Prenotazioni chiuse"}</div><div class="who">Chi canta?</div><div class="what">${S.settings.open ? "Inquadra il QR e mettiti in coda" : "Grazie a tutti per la serata!"}</div>`;
    }
    $("#nextBox").innerHTML = next.length ? `<div class="label">Prossimi</div><ol class="upnext">${next.slice(0, 4).map((q, i) => `<li><span class="n">${i + 1}</span><div><b>${esc(q.singer)}</b> <span>· ${esc(q.title)}</span></div></li>`).join("")}</ol>` : "";
  }

  $("#fsBtn").onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch {} };
})();
</script>
</body>
</html>
